<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow-m" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a1618" />
      <stop offset="100%" stop-color="#110d0e" />
    </radialGradient>
    <linearGradient id="seal-grad-m" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#e04f44" />
      <stop offset="55%" stop-color="#c93b32" />
      <stop offset="100%" stop-color="#9e261f" />
    </linearGradient>
    <linearGradient id="gold-grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d285" />
      <stop offset="100%" stop-color="#d49b38" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bg-glow-m)" />

  <!-- Cinnabar Seal scaled inside ~64% safe zone -->
  <rect x="132" y="132" width="248" height="248" rx="52" fill="url(#seal-grad-m)" />
  <rect x="145" y="145" width="222" height="222" rx="42" fill="none" stroke="url(#gold-grad-m)" stroke-width="4" stroke-opacity="0.85" />

  <!-- Stylized Hanzi "说" -->
  <text
    x="256"
    y="286"
    text-anchor="middle"
    font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif"
    font-size="144"
    font-weight="700"
    fill="#f7f2ef"
  >说</text>

  <!-- Voice wave accent -->
  <path d="M 218 330 Q 256 346 294 330" fill="none" stroke="url(#gold-grad-m)" stroke-width="7" stroke-linecap="round" />
</svg>
